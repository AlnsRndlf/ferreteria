<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Página de inicio de sesión"
    >
    <title>Iniciar sesión | Ferretaria Los Hermanos</title>

    <link rel="stylesheet" href="assets/css/estilos.css">
</head>

<body>
    <header class="cabecera-sitio">

        <div class="cabecera-top">
            <div class="logo">
                <span class="logo-icono"></span>
                <strong>Ferretería los Hermanos</strong>
            </div>

            <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="menu-principal" aria-label="Abrir menú">
                ☰
            </button>
        </div>

        <nav class="nav-principal" id="menu-principal" aria-label="Navegación principal">
            <ul class="menu">
                <li><a href="index.html" aria-current="page">Inicio</a></li>

                <li><a href="productos.html">Productos</a></li>

                <li><a href="nosotros.html">Nosotros</a></li>

                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>

        <div class="carrito">
            <a href="carrito.html" aria-label="Ver carrito de compras">
                🛒
                <span>Cart (0)</span>
            </a>
        </div>

    </header>

    <main class="contenedor-login">
        <section class="tarjeta-login" aria-labelledby="titulo-login">

            <header class="encabezado-login">
                <h1 id="titulo-login">Iniciar sesión</h1>
                <p>
                    Ingresa tus datos para acceder a tu cuenta.
                </p>
            </header>

            <form class="formulario-login" action="#" method="post">

                <div class="campo-formulario">
                    <label for="correo">Correo electrónico</label>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="ejemplo@correo.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="campo-formulario">
                    <label for="contrasena">Contraseña</label>
                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div class="opciones-login">
                    <label>
                        <input
                            type="checkbox"
                            name="recordarme"
                        >
                        Recordarme
                    </label>

                    <a href="recuperar-contrasena.html">
                        ¿Olvidaste tu contraseña?
                    </a>
                </div>

                <button
                    type="submit"
                    class="boton-login"
                >
                    Iniciar sesión
                </button>
            </form>

            <footer class="registro-login">
                <p>
                    ¿No tienes una cuenta?
                    <a href="registro.html">
                        Regístrate aquí
                    </a>
                </p>
            </footer>

        </section>
    </main>
</body>
</html>
