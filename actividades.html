<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cartelera de talleres y actividades de Ferretería los Maestros.">
    <title>Tienda Online | Cartelera</title>
    <link rel="stylesheet" href="assets/css/estilos.css">
</head>

<body>
    <header class="cabecera-sitio">

        <div class="cabecera-top">
            <div class="logo">
                <span class="logo-icono"></span>
                <strong>Ferretería los Maestros</strong>
            </div>

            <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="menu-principal" aria-label="Abrir menú">
                ☰
            </button>
        </div>

        <nav class="nav-principal" id="menu-principal" aria-label="Navegación principal">
            <ul class="menu">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="actividades.html" aria-current="page">Actividades</a></li>
            </ul>
        </nav>

        <div class="carrito">
            <a href="carrito.html" aria-label="Ver carrito de compras">
                <span>carrito <br> (proximamente)</span>
            </a>
        </div>

    </header>
    <script>
    </script>
    <main id="contenido-principal">

        <div class="autenticacion">
            <a href="inicio-sesion.html">Iniciar sesión</a>
            <span>|</span>
            <a href="registro.html">Registrar usuario</a>
        </div>

        <h1 class="centrado">CARTELERA DE ACTIVIDADES</h1>

        <section class="cartelera-section" aria-labelledby="titulo-cartelera">
            <h2 id="titulo-cartelera" class="visualmente-oculto">
                Actividades y Talleres
            </h2>
            <div class="filtros-container">
                <div class="campo-filtro">
                    <label for="filtro-categoria">Categoría:</label>
                    <select id="filtro-categoria">
                        <option value="todas">Todas las categorías</option>
                        <option value="Gafiteria">Gafiteria</option>
                        <option value="Construcion">Construcion</option>
                        <option value="Uso">Herramientas</option>
                    </select>
                </div>

                <div class="campo-filtro">
                    <label class="checkbox-label">
                        <input type="checkbox" id="filtro-disponibles"> Mostrar solo con cupos disponibles
                    </label>
                </div>
            </div>
            <div id="contenedor-tarjetas" class="grilla-productos"></div>
        </section>

    </main>
    <footer class="pie-sitio">

        <div class="informacion-pie">

            <p>
                Ferreteria los Hermanos.
            </p>

        </div>
        <div class="newsletter">

            <p>
                Suscríbete para recibir todas las novedades y promociones.
            </p>

            <form action="#" method="post">

                <label for="correo-newsletter" class="visualmente-oculto">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correo-newsletter"
                    name="correo"
                    placeholder="email@ejemplo.com"
                    autocomplete="email"
                    required
                >

                <button type="submit">
                    Suscribirme
                </button>

            </form>

        </div>

    </footer>
    <script src="assets/js/cartelera.js"></script>
</body>
</html>
